[project]
name = "antibot-crawler"
version = "1.0.0"
description = "Universal Anti-Detection Web Crawler - Combines best features of Firecrawl, Scrapling, Scrapy, and Browser Fingerprinting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "殷兆雨", email = "yinzhaoyu@gmail.com"}
]
keywords = ["crawler", "scraping", "anti-bot", "stealth", "cloudflare", "web-scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing-Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "curl_cffi>=0.7.0",
    "patchright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
antibot-crawler = "antibot_crawler:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
